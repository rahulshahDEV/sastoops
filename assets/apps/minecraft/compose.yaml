services:
  mc:
    image: itzg/minecraft-server:{{.Version}}
    restart: unless-stopped
    ports:
      - "{{.Port}}:25565"
    environment:
      EULA: "TRUE"
      TYPE: "{{Param "type"}}"
      MEMORY: "{{Param "memory"}}"
      ONLINE_MODE: "{{Param "online_mode"}}"
      ENABLE_AUTOPAUSE: "FALSE"
    volumes:
      - mc_data:/data
volumes:
  mc_data: